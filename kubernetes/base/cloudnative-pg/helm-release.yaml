apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: databases
  chart:
    spec:
      chart: cloudnative-pg
      version: ">= 0.22.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
