apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: argocd
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: argocd
  chart:
    spec:
      chart: argo-cd
      version: ">= 7.0.0"
      sourceRef:
        kind: HelmRepository
        name: argo-cd
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    crds:
      install: true
      keep: true
    server:
      # Hardening: UI should be read-only as defined in detailed.md
      config:
        repos: ""
      rbacConfig:
        policy.default: "role:readonly"
