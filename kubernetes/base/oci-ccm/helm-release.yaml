apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: oci-ccm
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: oci-cloud-controller-manager
      version: ">= 1.27.0"
      sourceRef:
        kind: HelmRepository
        name: oci-ccm
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    auth:
      useInstancePrincipals: true
