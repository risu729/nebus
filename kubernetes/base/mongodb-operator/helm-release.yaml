apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: mongodb-operator
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: databases
  chart:
    spec:
      chart: community-operator
      version: ">= 0.10.0"
      sourceRef:
        kind: HelmRepository
        name: mongodb-operator
      interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
