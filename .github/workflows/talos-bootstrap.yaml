name: Talos Bootstrap

on:
  workflow_dispatch:
    inputs:
      node_ip:
        description: 'The IP address of the Control Plane node to bootstrap'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  bootstrap:
    name: Bootstrap Talos Cluster
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # for checkout

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        with:
          version: 2026.2.16

      - name: Talos Bootstrap
        env:
          NODE_IP: ${{ inputs.node_ip }}
        run: |
          echo "Bootstrapping Talos on node ${NODE_IP}..."
          # talosctl config ...
          # talosctl bootstrap --nodes ${NODE_IP}
